name: Pull request test

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  pr-test:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on GITHUB_TOKEN debug logging
        shell: bash
        run: |
          if grep -F 'echo "GITHUB_TOKEN:' .github/workflows/build.yml; then
            echo 'Never interpolate credentials into diagnostic logs.' >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Install Surfer
        run: npm i -g @zen-browser/surfer

      - name: Install dependencies
        run: npm install

      - name: Download Firefox and dependencies
        run: surfer download

      - name: Import patches
        run: surfer i
